{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Confirmed · The Last Note</title><link rel="stylesheet" href="{% static 'css/style.css' %}"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--ink:#181b2d;--gold:#d4af37;--cream:#faf8f3}body{margin:0;background:#f8f7f4;font-family:'DM Sans',sans-serif;color:#29292e}.wrap{max-width:820px;margin:70px auto;padding:22px}.card{background:#fff;border:1px solid #ebe6dc;border-radius:22px;padding:48px;text-align:center;box-shadow:0 20px 55px rgba(25,25,25,.07)}.mark{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#181b2d;color:#d4af37;font-size:32px;box-shadow:0 0 0 9px rgba(212,175,55,.11)}.eyebrow{font-size:10px;letter-spacing:3px;color:#a88619;font-weight:700}.card h1{font:500 38px 'Playfair Display',serif;color:#181b2d;margin:9px 0}.number{font:500 25px 'Playfair Display',serif;color:#a88619;margin:18px 0 5px}.sub{font-size:12px;color:#888}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:28px 0}.tile{background:var(--cream);border:1px solid #ece6da;border-radius:12px;padding:14px}.tile small{display:block;color:#999;text-transform:uppercase;letter-spacing:1px;font-size:9px;margin-bottom:6px}.tile strong{font-size:14px;color:#181b2d}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:25px}.btn{display:inline-flex;text-decoration:none;padding:12px 16px;border-radius:7px;background:#181b2d;color:#d4af37;border:1px solid #d8c99d;font-size:11px;font-weight:700}.btn.secondary{background:#fff;color:#181b2d;border-color:#ddd8cf}@media(max-width:600px){.wrap{margin:25px auto}.card{padding:30px 20px}.card h1{font-size:30px}.summary{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><div class="mark">✓</div><div class="eyebrow">THE LAST NOTE · ORDER CONFIRMED</div><h1>Your fragrance is on its way.</h1><div id="summary"><p class="sub">Loading your order details…</p></div><div class="actions"><a class="btn" id="track" href="/customer/">Track Order</a><a class="btn secondary" id="invoice" href="/customer/">Invoice</a><a class="btn secondary" href="/shop/">Continue Shopping</a></div></div></div><script>const token=localStorage.getItem('access_token'),id=new URLSearchParams(location.search).get('order_id'),summary=document.getElementById('summary');const money=v=>`৳${Number(v||0).toLocaleString('en-BD',{minimumFractionDigits:2,maximumFractionDigits:2})}`;if(!token||!id){summary.innerHTML='<p class="sub">Your order was created. Open My Orders to see the details.</p>'}else{fetch(`/api/orders/${id}/`,{headers:{Authorization:`Bearer ${token}`}}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load order');return d}).then(d=>{const o=d.order;summary.innerHTML=`<div class="number">${o.order_number}</div><p class="sub">${o.items.length} ${o.items.length===1?'item':'items'} · Cash on Delivery</p><div class="summary"><div class="tile"><small>Status</small><strong>${o.order_status}</strong></div><div class="tile"><small>Total</small><strong>${money(o.total_amount)}</strong></div><div class="tile"><small>Payment</small><strong>${o.payment_status||'Pending'}</strong></div></div>`;document.getElementById('track').href=`/order-tracking/?id=${id}`;document.getElementById('invoice').href=`/invoice/?order_id=${id}`}).catch(()=>summary.innerHTML='<p class="sub">Your order was created. Open My Orders to see the details.</p>')}</script></body></html>
