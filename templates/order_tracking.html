{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Details · The Last Note</title>
<meta name="description" content="Track your fragrance order with The Last Note.">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#181b2d;--ink2:#242a43;--gold:#d4af37;--cream:#faf8f3;--line:#e9e4da;--muted:#8c8b8b}*{box-sizing:border-box}body{margin:0;background:#f8f7f4;color:#24242a;font-family:'DM Sans',sans-serif}.page{max-width:1180px;margin:42px auto 70px;padding:0 22px}.crumbs{font-size:11px;color:#999;margin-bottom:18px}.crumbs a{color:#777;text-decoration:none}.hero{background:linear-gradient(135deg,var(--ink),var(--ink2));border-radius:22px;padding:28px 32px;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;box-shadow:0 20px 50px rgba(20,24,42,.13)}.eyebrow{font-size:10px;letter-spacing:2.4px;color:var(--gold);font-weight:700}.hero h1{font:500 36px 'Playfair Display',serif;margin:8px 0 5px}.hero p{margin:0;color:rgba(255,255,255,.7);font-size:12px}.hero-side{text-align:right}.hero-side .status{display:inline-block;padding:8px 13px;border-radius:999px;background:rgba(212,175,55,.13);border:1px solid rgba(212,175,55,.4);color:var(--gold);font-size:11px;font-weight:700}.hero-total{font:500 25px 'Playfair Display',serif;margin-top:12px}.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.8fr);gap:20px;margin-top:20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:0 8px 28px rgba(30,30,30,.045)}.card-title{font:500 20px 'Playfair Display',serif;color:var(--ink);margin:0 0 16px}.item{display:grid;grid-template-columns:78px 1fr auto;gap:15px;padding:15px 0;border-bottom:1px solid #f0ede7;align-items:center}.item:last-child{border-bottom:0}.item img{width:78px;height:78px;object-fit:cover;border-radius:12px;background:#f4f1ea}.item-name{font-size:14px;font-weight:600;color:var(--ink)}.item-meta{font-size:11px;color:#999;margin-top:5px;line-height:1.6}.item-price{text-align:right;font-weight:700;color:var(--ink)}.item-price small{display:block;color:#999;font-weight:400;margin-top:3px}.timeline{position:relative}.tl{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:22px}.tl:last-child{padding-bottom:0}.tl:not(:last-child)::after{content:'';position:absolute;left:13px;top:28px;width:2px;height:calc(100% - 15px);background:#e2dccf}.dot{width:28px;height:28px;border-radius:50%;background:#eeeae1;color:#999;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:1}.tl.done .dot{background:var(--ink);color:var(--gold)}.tl.current .dot{background:var(--gold);color:var(--ink);box-shadow:0 0 0 6px rgba(212,175,55,.12)}.tl h4{margin:3px 0 3px;color:var(--ink);font-size:13px}.tl p{margin:0;color:#999;font-size:10px}.tl .note{margin-top:5px;color:#666;font-size:11px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.info{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12px;line-height:1.7;color:#555}.info strong{display:block;text-transform:uppercase;letter-spacing:1.4px;font-size:9px;color:#999;margin-bottom:5px}.summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:12px;color:#666}.summary-row.total{border-top:2px solid var(--gold);margin-top:8px;padding-top:13px;font-weight:700;color:var(--ink);font-size:15px}.summary-row.total b{color:#a88619;font:600 22px 'Playfair Display',serif}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #d8c99d;background:var(--ink);color:var(--gold);padding:10px 13px;border-radius:7px;font-size:10px;font-weight:700;cursor:pointer}.btn.secondary{background:#fff;color:var(--ink);border-color:#ded9cf}.btn.danger{background:#fff;color:#ad4a4a;border-color:#e7caca}.notice{background:#f8f4e7;border:1px solid #eadbb0;color:#6e5b20;border-radius:12px;padding:12px;font-size:11px;line-height:1.6;margin-top:14px}.loading,.error{max-width:760px;margin:90px auto;text-align:center;padding:40px;background:#fff;border:1px solid var(--line);border-radius:18px}.error h2{font:500 26px 'Playfair Display',serif;color:var(--ink)}@media(max-width:850px){.grid{grid-template-columns:1fr}.hero{flex-direction:column}.hero-side{text-align:left}.info-grid{grid-template-columns:1fr}}@media(max-width:560px){.page{margin-top:20px}.hero{padding:23px}.hero h1{font-size:29px}.item{grid-template-columns:58px 1fr}.item img{width:58px;height:58px}.item-price{grid-column:2;text-align:left}.card{padding:17px}}
</style></head>
<body>
<div class="page"><div class="crumbs"><a href="/customer/">My Account</a> &nbsp; / &nbsp; Order Details</div><div id="app"><div class="loading">Loading your order…</div></div></div>
<script>
const token=localStorage.getItem('access_token');const orderId=new URLSearchParams(location.search).get('id');
const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>`৳${Number(v||0).toLocaleString('en-BD',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const imageUrl=u=>{if(!u)return '';if(/^https?:\/\//i.test(u))return u;return u.startsWith('/')?u:`/media/${u}`};
const statuses=['Pending','Confirmed','Processing','Shipped','Delivered'];
function render(d){const o=d.order,items=d.items||[],history=d.tracking_history||[],progress=statuses.indexOf(o.status);const shipping=o.shipping||{};
const timeline=statuses.map((s,i)=>{const h=history.find(x=>x.status===s);const cls=i<progress?'done':i===progress?'current':'';return `<div class="tl ${cls}"><div class="dot">${i<progress?'✓':i===progress?'●':'○'}</div><div><h4>${s}</h4><p>${h?new Date(h.timestamp).toLocaleString('en-BD'):(i<progress?'Completed':'Upcoming')}</p>${h?.message?`<div class="note">${esc(h.message)}</div>`:''}</div></div>`}).join('');
const itemRows=items.map(i=>`<div class="item"><img src="${esc(imageUrl(i.image||i.product_image))}" onerror="this.style.visibility='hidden'" alt=""><div><div class="item-name">${esc(i.name)}</div><div class="item-meta">${esc(i.brand)} · ${esc(i.product_type)} · ${i.volume_ml} ml<br>Quantity ${i.quantity}</div></div><div class="item-price">${money(i.total)}<small>${money(i.unit_price)} each</small></div></div>`).join('');
const delivered=o.status==='Delivered';
app.innerHTML=`<section class="hero"><div><div class="eyebrow">THE LAST NOTE · ORDER JOURNEY</div><h1>${esc(o.order_number)}</h1><p>Placed ${new Date(o.order_date||o.date).toLocaleString('en-BD',{dateStyle:'full',timeStyle:'short'})}</p></div><div class="hero-side"><span class="status">${esc(o.order_status||o.status)}</span><div class="hero-total">${money(o.total_amount||o.total)}</div></div></section>
<div class="grid"><main><section class="card"><h2 class="card-title">Your items</h2>${itemRows||'<p>No items found.</p>'}</section><section class="card" style="margin-top:20px"><h2 class="card-title">Order progress</h2><div class="timeline">${timeline}</div>${o.status==='Shipped'?'<div class="notice"><strong>Your order is on its way.</strong><br>Courier tracking details can be added by the delivery team when available.</div>':''}</section><section class="card" style="margin-top:20px"><h2 class="card-title">Delivery & payment</h2><div class="info-grid"><div class="info"><strong>Delivering to</strong>${esc(shipping.name)}<br>${esc(shipping.phone)}<br>${esc(shipping.address_line1)}${shipping.address_line2?', '+esc(shipping.address_line2):''}<br>${esc(shipping.city)}${shipping.state?', '+esc(shipping.state):''} ${esc(shipping.postal_code)}<br>${esc(shipping.country)}</div><div class="info"><strong>Payment</strong>${esc(o.payment_method||'Cash on Delivery')}<br>Status: ${esc(o.payment_status||'Pending')}<br>Order total: ${money(o.total_amount||o.total)}</div></div></section></main>
<aside><section class="card"><h2 class="card-title">Order summary</h2><div class="summary-row"><span>Subtotal</span><b>${money(o.subtotal)}</b></div><div class="summary-row"><span>Delivery</span><b>${money(o.shipping_cost)}</b></div><div class="summary-row"><span>Discount</span><b>- ${money(o.discount)}</b></div><div class="summary-row total"><span>Total</span><b>${money(o.total_amount||o.total)}</b></div><div class="actions"><a class="btn" href="/invoice/?order_id=${o.order_id}">Print / Invoice</a><a class="btn secondary" href="/customer/">My Orders</a>${delivered?`<button class="btn secondary" onclick="buyAgain()">Buy Again</button>`:''}${o.can_cancel?`<button class="btn danger" onclick="cancelOrder()">Cancel Order</button>`:''}</div></section><section class="card" style="margin-top:20px"><h2 class="card-title">Need help?</h2><p style="font-size:12px;color:#777;line-height:1.7;margin:0">Keep your order number ready when contacting the store about delivery, payment or product questions.</p><div class="notice">Order reference: <strong>${esc(o.order_number)}</strong></div><div class="actions"><a class="btn secondary" href="/shop/">Continue Shopping</a></div></section></aside></div>`;
}
async function load(){if(!token||!orderId){app.innerHTML='<div class="error"><h2>Sign in to view your order</h2><p>Please sign in and open the order again.</p><a class="btn" href="/">Return Home</a></div>';return}try{const r=await fetch(`/api/orders/${orderId}/`,{headers:{Authorization:`Bearer ${token}`}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Order could not be loaded.');render(d)}catch(e){app.innerHTML=`<div class="error"><h2>We couldn't load this order</h2><p>${esc(e.message)}</p><a class="btn" href="/customer/">Back to My Orders</a></div>`}}
async function buyAgain(){try{const r=await fetch(`/api/orders/${orderId}/`,{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Order could not be loaded.');let added=0,failed=0;for(const i of d.items||[]){const x=await fetch('/api/cart/add/',{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({product_id:i.product_id,quantity:i.quantity})});if(x.ok)added+=i.quantity;else failed++}if(added){alert(`${added} item${added===1?'':'s'} added to your bag.`);location.href='/cart/'}else alert('The previous items are no longer available.')}catch(e){alert(e.message)}}
async function cancelOrder(){const reason=prompt('Why would you like to cancel this order?','Customer requested cancellation');if(reason===null)return;try{const r=await fetch(`/api/orders/${orderId}/cancel/`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({reason:reason.trim()||'Customer requested cancellation'})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Order cannot be cancelled.');await load();}catch(e){alert(e.message)}}
load();
</script></body></html>
