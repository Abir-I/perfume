{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders · The Last Note Admin</title>
<link rel="stylesheet" href="{% static 'css/admin_premium_enhanced.css' %}">
<style>
body{background:#f7f5f0;color:#1a1a2e;font-family:Arial,sans-serif}.orders-wrap{max-width:1400px;margin:0 auto;padding:30px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.top h1{font-family:Georgia,serif;margin:0}.btn{border:1px solid #d4af37;background:#1a1a2e;color:#fff;padding:10px 15px;border-radius:5px;text-decoration:none;cursor:pointer}.btn.secondary{background:#fff;color:#1a1a2e}.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:20px}.stat{background:#fff;border:1px solid #eee;padding:15px;border-radius:10px}.stat strong{display:block;font-size:24px;margin-top:6px}.toolbar{background:#fff;padding:15px;border:1px solid #eee;border-radius:10px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.toolbar input,.toolbar select{padding:10px;border:1px solid #ddd;border-radius:5px}.table-wrap{background:#fff;border:1px solid #eee;border-radius:10px;overflow:auto}.orders{width:100%;border-collapse:collapse}.orders th,.orders td{padding:13px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.orders th{background:#faf9f6}.badge{padding:5px 9px;border-radius:20px;background:#eee;font-size:12px}.row-actions{display:flex;gap:6px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-card{background:#fff;max-width:900px;width:100%;max-height:90vh;overflow:auto;border-radius:12px;padding:25px}.modal-head{display:flex;justify-content:space-between}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin:15px 0}.detail-box{background:#faf9f6;padding:14px;border-radius:8px}.timeline{border-left:2px solid #d4af37;padding-left:20px}.timeline-item{margin:0 0 15px}.error{color:#b42318}.success{color:#137333}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="orders-wrap">
  <div class="top"><div><p style="letter-spacing:3px;font-size:11px;color:#8b7b65">THE LAST NOTE · ADMIN</p><h1>Order Management</h1></div><div><a class="btn secondary" href="/admin-premium/">Dashboard</a> <button class="btn" id="logout">Logout</button></div></div>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <input id="search" placeholder="Search customer, email or order...">
    <select id="status"><option value="">All statuses</option><option>Pending</option><option>Confirmed</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select>
    <input id="dateFrom" type="date"><input id="dateTo" type="date"><button class="btn" id="refresh">Refresh</button>
  </div>
  <div id="message"></div>
  <div class="table-wrap"><table class="orders"><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead><tbody id="body"><tr><td colspan="8">Loading...</td></tr></tbody></table></div>
</div>
<div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="detailTitle">Order</h2><button class="btn secondary" id="close">Close</button></div><div id="detail"></div></div></div>
<script>
const token=localStorage.getItem('access_token');
const auth=()=>({'Authorization':`Bearer ${token}`,'Content-Type':'application/json'});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...auth(),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.detail||`HTTP ${r.status}`);return d}
async function loadStats(){const d=await api('/api/orders/admin/stats/');const labels=[['Total','total'],['Pending','pending'],['Confirmed','confirmed'],['Processing','processing'],['Shipped','shipped'],['Delivered','delivered'],['Cancelled','cancelled']];document.getElementById('stats').innerHTML=labels.map(x=>`<div class="stat"><span>${x[0]}</span><strong>${d[x[1]]}</strong></div>`).join('')}
async function loadOrders(){const p=new URLSearchParams();if(search.value)p.set('search',search.value);if(status.value)p.set('status',status.value);if(dateFrom.value)p.set('date_from',dateFrom.value);if(dateTo.value)p.set('date_to',dateTo.value);try{const d=await api('/api/orders/admin/?'+p);body.innerHTML=d.results.length?d.results.map(o=>`<tr><td><strong>${esc(o.order_number)}</strong></td><td>${esc(o.customer_name)}<br><small>${esc(o.payment_method)}</small></td><td>${new Date(o.order_date).toLocaleString()}</td><td>${o.items_count}</td><td>৳${Number(o.total_amount).toFixed(2)}</td><td>${esc(o.payment_status)}</td><td><span class="badge">${esc(o.order_status)}</span></td><td><div class="row-actions"><button class="btn" onclick="openOrder(${o.order_id})">View</button></div></td></tr>`).join(''):'<tr><td colspan="8">No orders found.</td></tr>'}catch(e){body.innerHTML=`<tr><td colspan="8" class="error">${esc(e.message)}</td></tr>`}}
async function openOrder(id){try{const d=await api(`/api/orders/admin/${id}/`);const o=d;detailTitle.textContent=`${o.order_number} · ${o.customer_name}`;detail.innerHTML=`<div class="detail-grid"><div class="detail-box"><b>Status</b><br><span class="badge">${esc(o.order_status)}</span></div><div class="detail-box"><b>COD Payment</b><br>${esc(o.payment_status)}</div><div class="detail-box"><b>Subtotal</b><br>৳${Number(o.subtotal).toFixed(2)}</div><div class="detail-box"><b>Shipping</b><br>৳${Number(o.shipping_cost).toFixed(2)}</div><div class="detail-box"><b>Total</b><br>৳${Number(o.total_amount).toFixed(2)}</div><div class="detail-box"><b>Address</b><br>${esc(o.shipping.address_line1)}, ${esc(o.shipping.city)}<br>${esc(o.shipping.country)}</div></div><h3>Items</h3><table class="orders"><tr><th>Product</th><th>Variant</th><th>Qty</th><th>Unit</th><th>Total</th></tr>${d.items.map(i=>`<tr><td>${esc(i.name)}<br><small>${esc(i.brand)}</small></td><td>${esc(i.product_type)} · ${i.volume_ml} ml</td><td>${i.quantity}</td><td>৳${Number(i.unit_price).toFixed(2)}</td><td>৳${Number(i.subtotal).toFixed(2)}</td></tr>`).join('')}</table><h3>Status</h3><div class="toolbar"><select id="newStatus">${['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled'].map(s=>`<option ${s===o.order_status?'selected':''}>${s}</option>`).join('')}</select><input id="statusNote" placeholder="Optional note"><button class="btn" onclick="updateStatus(${id})">Update Status</button></div><h3>History</h3><div class="timeline">${(o.status_history||[]).map(h=>`<div class="timeline-item"><b>${esc(h.status)}</b><br>${esc(h.note)}<br><small>${new Date(h.timestamp).toLocaleString()} · ${esc(h.changed_by)}</small></div>`).join('')}</div>`;modal.classList.add('open')}catch(e){alert(e.message)}}
async function updateStatus(id){try{await api(`/api/orders/admin/${id}/status/`,{method:'PATCH',body:JSON.stringify({status:newStatus.value,note:statusNote.value})});await openOrder(id);await loadOrders();await loadStats()}catch(e){alert(e.message)}}
close.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};refresh.onclick=()=>{loadStats();loadOrders()};search.onkeydown=e=>{if(e.key==='Enter')loadOrders()};status.onchange=loadOrders;logout.onclick=()=>{localStorage.removeItem('access_token');localStorage.removeItem('refresh_token');location.href='/'};
if(!token){location.href='/'}else{loadStats();loadOrders()}
</script>
</body></html>
