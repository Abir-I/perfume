{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice · The Last Note</title><link rel="stylesheet" href="{% static 'css/style.css' %}"><style>
.invoice-wrap{max-width:900px;margin:45px auto;padding:24px}.invoice{background:#fff;border:1px solid #e8e3d7;border-radius:16px;padding:42px;box-shadow:0 16px 45px rgba(20,20,20,.06)}.head{display:flex;justify-content:space-between;gap:30px;border-bottom:1px solid #eee;padding-bottom:24px}.brand{font:32px Georgia,serif}.muted{color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin:26px 0}.box{background:#faf9f6;border-radius:10px;padding:16px}.items{width:100%;border-collapse:collapse;margin:25px 0}.items th,.items td{padding:12px 8px;border-bottom:1px solid #eee;text-align:left}.items th:last-child,.items td:last-child{text-align:right}.totals{max-width:360px;margin-left:auto}.row{display:flex;justify-content:space-between;padding:8px 0}.grand{border-top:2px solid #d4af37;margin-top:8px;padding-top:14px;font-size:20px;font-weight:700}.actions{text-align:center;margin-top:25px}.btn{border:1px solid #d4af37;background:#1a1a2e;color:#fff;padding:11px 18px;border-radius:6px;cursor:pointer;margin:4px}.status{display:inline-block;padding:5px 9px;border-radius:99px;background:#f1ead0}.error{padding:20px;text-align:center}@media(max-width:700px){.head,.grid{grid-template-columns:1fr;display:block}.invoice{padding:22px}.items{font-size:13px}}
@media print{body{background:#fff}.invoice-wrap{margin:0;padding:0}.invoice{box-shadow:none;border:0}.actions{display:none}}
</style></head><body><div class="invoice-wrap"><div id="app"><div class="error">Loading invoice…</div></div></div><script>
const token=localStorage.getItem('access_token');const id=new URLSearchParams(location.search).get('order_id');const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
if(!token||!id){app.innerHTML='<div class="invoice"><div class="error">Please sign in to view this invoice.</div></div>'}else{fetch(`/api/orders/${id}/invoice/`,{headers:{Authorization:`Bearer ${token}`}}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||'Invoice could not be loaded.');return d}).then(d=>{const i=d.invoice,o=d.order;app.innerHTML=`<div class="invoice"><div class="head"><div><div class="brand">The Last Note</div><div class="muted">Premium Fragrance House</div></div><div><strong>INVOICE</strong><br>${esc(i.invoice_number)}<br><span class="muted">Order ${esc(o.order_number)}</span></div></div><div class="grid"><div class="box"><strong>Bill To</strong><br>${esc(o.customer_name)}<br>${esc(o.email)}<br>${esc(o.phone)}</div><div class="box"><strong>Ship To</strong><br>${esc(d.shipping.address_line1)}${d.shipping.address_line2?', '+esc(d.shipping.address_line2):''}<br>${esc(d.shipping.city)}${d.shipping.state?', '+esc(d.shipping.state):''} ${esc(d.shipping.postal_code)}<br>${esc(d.shipping.country)}</div></div><table class="items"><thead><tr><th>Item</th><th>Variant</th><th>Qty</th><th>Unit</th><th>Total</th></tr></thead><tbody>${d.items.map(x=>`<tr><td>${esc(x.name)}<br><span class="muted">${esc(x.brand)}</span></td><td>${esc(x.product_type)} · ${x.volume_ml} ml</td><td>${x.quantity}</td><td>৳${Number(x.unit_price).toFixed(2)}</td><td>৳${Number(x.subtotal).toFixed(2)}</td></tr>`).join('')}</tbody></table><div class="totals"><div class="row"><span>Subtotal</span><span>৳${Number(d.subtotal).toFixed(2)}</span></div><div class="row"><span>Shipping</span><span>৳${Number(d.shipping_cost).toFixed(2)}</span></div><div class="row"><span>Discount</span><span>- ৳${Number(d.discount).toFixed(2)}</span></div><div class="row"><span>Tax</span><span>৳${Number(d.tax).toFixed(2)}</span></div><div class="row grand"><span>Total</span><span>৳${Number(d.total).toFixed(2)}</span></div></div><p class="muted">Payment: ${esc(d.payment_method)} · ${esc(d.payment_status)} · Invoice status: <span class="status">${esc(i.status)}</span></p><div class="actions"><button class="btn" onclick="window.print()">Print Invoice</button><a class="btn" href="/customer/">My Orders</a></div></div>`}).catch(e=>app.innerHTML=`<div class="invoice"><div class="error">${esc(e.message)}</div></div>`)}</script></body></html>
